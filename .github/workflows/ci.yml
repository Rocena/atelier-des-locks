name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # audit hebdomadaire des dépendances

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier_des_locks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atelier" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm test
        env:
          DATABASE_URL: postgres://atelier:atelier@127.0.0.1:5432/atelier_des_locks
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
